<header class="topbar">
  <button class="icon-btn btn-menu-mobile" id="btn-menu-mobile" type="button" aria-label="Abrir menu">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <div class="search-wrap" id="search-wrap-container" role="search">
    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="busca-global" placeholder="Buscar no sistema…" autocomplete="off" aria-label="Busca global">
    <kbd class="search-kbd">Ctrl K</kbd>
    <div id="search-results-dropdown" class="search-results-dropdown" hidden></div>
  </div>

  <div class="header-right">
    <button class="icon-btn" id="btn-header-notif" type="button" aria-label="Notificações" title="Notificações">
      <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="notif-dot" hidden>0</span>
    </button>

    <div class="user-menu-wrap" id="user-menu-wrap">
      <button class="user-pill" id="user-pill" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-dropdown-menu">
        <span class="avatar" id="user-avatar"></span>
        <span class="user-pill-texto">
          <span class="uname" id="user-nome"></span>
          <span class="urole" id="user-cargo"></span>
        </span>
        <svg class="chevron" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="user-dropdown-menu" class="user-dropdown-menu" role="menu" hidden>
        <div class="user-dropdown-header">
          <strong id="dropdown-user-nome"></strong>
          <span id="dropdown-user-email"></span>
          <span class="badge b-blue" id="dropdown-user-perfil"></span>
        </div>
        <button class="user-dropdown-item" type="button" role="menuitem" data-page="perfil">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Meu perfil
        </button>
        <button class="user-dropdown-item" type="button" role="menuitem" data-page="configuracoes">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          Configurações
        </button>
        <div class="user-dropdown-divider"></div>
        <button class="user-dropdown-item perigo" type="button" role="menuitem" id="dropdown-btn-sair">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
          Encerrar sessão
        </button>
      </div>
    </div>
  </div>
</header>
