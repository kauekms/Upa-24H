<div class="page active" id="page-vacinacao">
  <div class="page-hd">
    <div>
      <div class="breadcrumb">Administração › <span>Vacinação</span></div>
      <div class="page-title">Campanha de Vacinação</div>
      <div class="page-sub">Monitoramento de doses, coberturas e estoques das vacinas.</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" id="btn-entrada-estoque" type="button" style="display:none">Entrada de Estoque</button>
      <button class="btn btn-primary" id="btn-registrar-vacinacao" type="button">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Registrar Aplicação
      </button>
    </div>
  </div>
  <div class="stats-grid cols4" data-box="stats" style="margin-bottom:20px"></div>
  <div style="display:grid;grid-template-columns:1fr 320px;gap:16px">
    <div>
      <div class="card">
        <div class="card-header"><span class="card-title">Painel de Vacinas</span></div>
        <div style="padding:8px 20px 16px">
          <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted)"><div>Vacina</div><div>Estoque</div><div>Cobertura</div><div>Status</div></div>
          <div data-box="vacinas-painel"></div>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="card-header"><span class="card-title">Últimas Aplicações</span></div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Cidadão</th><th>Vacina</th><th>Dose</th><th>Data/Hora</th><th>Profissional</th><th>Unidade</th></tr></thead>
          <tbody data-box="aplicacoes-tbody"></tbody>
        </table></div>
        <div class="pagination"><span class="page-info"></span><div class="page-btns"></div></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="padding:16px 20px">
        <div class="card-title" style="margin-bottom:12px">Alertas de Estoque</div>
        <div data-box="alertas-estoque"></div>
      </div>
      <div class="card" style="padding:16px 20px">
        <div class="card-title" style="margin-bottom:14px">Cobertura por Faixa Etária</div>
        <div data-box="faixas-etarias"></div>
      </div>
    </div>
  </div>
</div>
